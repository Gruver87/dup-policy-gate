[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dup-policy-gate"
version = "0.1.0"
description = "Fail-closed spot-only policy gate before any order (FUTURES_BLOCK, size caps, audit)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Uladzimir Dabranski" }]
keywords = ["policy", "spot", "fail-closed", "dup-labs", "futures-block"]
dependencies = [
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
dup-policy-gate = "policy_gate.cli:main"

[project.urls]
Homepage = "https://github.com/Gruver87/dup-policy-gate"
Repository = "https://github.com/Gruver87/dup-policy-gate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
